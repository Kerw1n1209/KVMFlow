[package]
name = "kvmflow-desktop"
version = "0.2.7"
description = "KVMFlow tray client with an embedded Rust hardware runtime"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
kvmflow-core = { path = "../../sidecar/crates/core" }
kvmflow-sidecar = { path = "../../sidecar/crates/sidecar" }
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
