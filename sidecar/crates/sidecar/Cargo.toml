[package]
name = "kvmflow-sidecar"
description = "KVMFlow shared runtime and standalone JSONL server, with IOKit/m1ddc and SetupAPI/dxva2 adapters and a simulated backend."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kvmflow-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
snow = { path = "../../vendor/snow", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
mdns-sd = "0.21"
blake2 = "0.10"
sha2 = "0.10"
getrandom = "0.4"
zeroize = "1"
subtle = "2.6"
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.15"

[features]
# Windows display detach (SetDisplayConfig) is not verified on hardware yet.
# Off by default; KVMFLOW_WINDOWS_DISPLAY_DETACH=1 enables it at run time too.
windows-display-detach = []

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Usb",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"
