[workspace]
resolver = "2"
members = ["crates/core", "crates/sidecar"]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = "symbols"
